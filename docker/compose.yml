# ============================================================
# TestService - Docker Compose
# ============================================================
# Las variables se cargan desde el archivo .env en la raiz del proyecto.
# Copiar .env.example a .env y configurar valores reales.
# ============================================================

services:
  postgres:
    image: postgres:17
    container_name: testservice-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: testservice-app
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      PORT: ${APP_PORT}
    ports:
      - "${APP_PORT:-3000}:3000"
    command: >
      sh -c "node /app/node_modules/prisma/build/index.js migrate deploy && node /app/prisma/seed.js && node server.js"

volumes:
  postgres_data: